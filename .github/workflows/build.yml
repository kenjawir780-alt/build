name: Android APK Build

'on':
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Install Android SDK and NDK
    run: |
      sdkmanager "platforms;android-34"
      sdkmanager "build-tools;34.0.0"
      sdkmanager "ndk;24.0.8215888"

  - name: Extract project
    run: |
      unzip -q god.zip -d extracted
      ls -la extracted

  - name: Locate Gradle project
    run: |
      find extracted -name gradlew -type f

  - name: Build debug APK
    run: |
      PROJECT_DIR="$(dirname "$(find extracted -name gradlew -type f | head -n 1)")"
      test -n "$PROJECT_DIR"
      cd "$PROJECT_DIR"
      chmod +x gradlew
      ./gradlew assembleDebug --stacktrace

  - name: Upload APK
    if: success()
    uses: actions/upload-artifact@v4
    with:
      name: GODMOD-debug-APK
      path: extracted/**/app/build/outputs/apk/debug/*.apk
      if-no-files-found: error
