name: Android APK Build

'on':
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4

  - uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - uses: android-actions/setup-android@v3

  - name: Install SDK and NDK
    run: |
      sdkmanager "platforms;android-34"
      sdkmanager "build-tools;34.0.0"
      sdkmanager "ndk;24.0.8215888"

  - name: Extract ZIP
    run: unzip -q god.zip -d extracted

  - name: Find Gradle wrapper
    id: gradle
    run: |
      FILE="$(find extracted -type f -name gradlew | head -n 1)"
      if [ -z "$FILE" ]; then
        echo "gradlew tidak ditemukan"
        exit 1
      fi
      echo "file=$FILE" >> "$GITHUB_OUTPUT"

  - name: Build APK
    run: |
      chmod +x "${{ steps.gradle.outputs.file }}"
      cd "$(dirname "${{ steps.gradle.outputs.file }}")"
      ./gradlew assembleDebug --stacktrace

  - name: Upload APK
    if: success()
    uses: actions/upload-artifact@v4
    with:
      name: GODMOD-debug-APK
      path: extracted/**/app/build/outputs/apk/debug/*.apk
      if-no-files-found: error
